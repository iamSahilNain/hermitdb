name: ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        threads: [1, 2, 4, 8]
    env:
      HERMIT_EXTRA_ARGS: --threads=${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build (-Wall -Wextra -Werror)
        run: cmake --build build -j
      - name: All unit and integration tests (required)
        run: ctest --test-dir build --output-on-failure

  tsan:
    runs-on: ubuntu-latest
    env:
      HERMIT_EXTRA_ARGS: --threads=4
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
    steps:
      - uses: actions/checkout@v4
      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -DHERMIT_TSAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-tsan -j
      - name: Unit tests under TSan
        run: ctest --test-dir build-tsan -E '^integration_' --output-on-failure
      - name: Concurrent socket clients under TSan (four reactor threads)
        run: ctest --test-dir build-tsan -R '^integration_(concurrency|incr)$' --output-on-failure
