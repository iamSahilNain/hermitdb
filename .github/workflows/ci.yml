name: ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build (-Wall -Wextra -Werror)
        run: cmake --build build -j
      - name: Scaffold tests (required)
        run: ctest --test-dir build -L scaffold --output-on-failure
      # Checkpoint tests are EXPECTED to fail until the corresponding CP is
      # hand-implemented (SPEC §0.3). Informational only — never blocks CI.
      - name: Checkpoint tests (informational)
        run: ctest --test-dir build -LE scaffold --output-on-failure || true

  tsan:
    # Becomes load-bearing at CP5 (SPEC §5); until then it proves the TSan
    # build stays healthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -DHERMIT_TSAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-tsan -j
      - name: Scaffold tests under TSan
        run: ctest --test-dir build-tsan -L scaffold --output-on-failure
